spring.application.name=jwtDemo

# Let Render dictate the port, do NOT leave it at 0 for production
server.port=${PORT:8080}

# Database Configurations using Variables
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Security Secrets using Variables
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Payment Gateways using Variables
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.currency=INR

# Connection Pool Settings (Safe to leave hardcoded)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=20000
